<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - RTI Mithra</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">🏛️ RTI Mithra</div>

    <a href="index.html">Home</a>

</header>


<div class="form-container">

    <div class="form-card">

        <div class="form-icon">🔐</div>

        <h1>Login</h1>

        <p>Enter your details to continue</p>


        <label>Full Name</label>

        <input
            type="text"
            id="userName"
            placeholder="Enter your name"
        >


        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter 10-digit phone number"
            maxlength="10"
        >


        <button
            class="btn full-btn"
            onclick="sendOTP()">

            Send OTP 📱

        </button>


        <p class="demo-text">
            Demo project: OTP will be displayed for testing.
        </p>

    </div>

</div>


<script src="js/script.js"></script>

</body>
</html>
