<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OTP Verification - RTI Mithra</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">🏛️ RTI Mithra</div>

</header>


<div class="form-container">

    <div class="form-card">

        <div class="form-icon">📱</div>

        <h1>Verify OTP</h1>

        <p>Enter the OTP generated for this demo.</p>


        <input
            type="text"
            id="otpInput"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
        >


        <button
            class="btn full-btn"
            onclick="verifyOTP()">

            Verify OTP ✓

        </button>


        <p id="otpMessage"></p>


        <a href="login.html" class="back-link">
            ← Back to Login
        </a>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
